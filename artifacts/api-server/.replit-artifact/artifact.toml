kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"
deploymentTarget = "vm"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python server.py"

[services.production]
build = ["pip", "install", "-r", "artifacts/api-server/requirements.txt"]
run = ["python", "artifacts/api-server/server.py"]

[services.production.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
