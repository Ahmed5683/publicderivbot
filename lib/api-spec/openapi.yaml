openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Deriv Market Analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Market analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /market/analysis:
    get:
      operationId: getMarketAnalysis
      tags: [market]
      summary: Get full market analysis for all symbols
      responses:
        "200":
          description: Market analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSummary"

  /market/candles/{symbol}:
    get:
      operationId: getSymbolCandles
      tags: [market]
      summary: Get 1000 candles for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candle data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"

  /market/symbols:
    get:
      operationId: getSymbolList
      tags: [market]
      summary: Get list of available symbols
      responses:
        "200":
          description: Symbol list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolInfo"

  /market/trades:
    get:
      operationId: getTradeHistory
      tags: [market]
      summary: Get recent trade history placed by the bot
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRecord"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Candle:
      type: object
      properties:
        time:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
      required:
        - time
        - open
        - high
        - low
        - close

    SymbolInfo:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        multiplier:
          type: number
      required:
        - symbol
        - name
        - multiplier

    MACDData:
      type: object
      properties:
        macd:
          type: number
        signal:
          type: number
        histogram:
          type: number
        macd_bullish:
          type: boolean
        macd_bearish:
          type: boolean
        values:
          type: array
          items:
            type: number
        signal_values:
          type: array
          items:
            type: number
        histogram_values:
          type: array
          items:
            type: number
      required:
        - macd
        - signal
        - histogram
        - macd_bullish
        - macd_bearish

    TSIData:
      type: object
      properties:
        value:
          type: number
        is_oversold:
          type: boolean
        is_overbought:
          type: boolean
        values:
          type: array
          items:
            type: number
      required:
        - value
        - is_oversold
        - is_overbought

    SymbolAnalysis:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        volatility:
          type: number
        trend:
          type: string
          enum: [UPTREND, DOWNTREND]
        ema100:
          type: number
        ema350:
          type: number
        signal:
          type: string
          enum: [BUY, SELL, NONE]
        tsi:
          $ref: "#/components/schemas/TSIData"
        macd:
          $ref: "#/components/schemas/MACDData"
        last_updated:
          type: string
      required:
        - symbol
        - name
        - price
        - volatility
        - trend
        - signal

    MarketSummary:
      type: object
      properties:
        timestamp:
          type: string
        buy_count:
          type: number
        sell_count:
          type: number
        uptrend_count:
          type: number
        downtrend_count:
          type: number
        symbols:
          type: array
          items:
            $ref: "#/components/schemas/SymbolAnalysis"
      required:
        - timestamp
        - buy_count
        - sell_count
        - uptrend_count
        - downtrend_count
        - symbols

    TradeRecord:
      type: object
      properties:
        timestamp:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        contract_type:
          type: string
        contract_id:
          type: string
        ask_price:
          type: number
        multiplier:
          type: number
        tsi:
          type: number
        macd_histogram:
          type: number
        status:
          type: string
          enum: [PLACED, FAILED]
        error:
          type: ["string", "null"]
      required:
        - timestamp
        - symbol
        - side
        - contract_type
        - status
