openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Deriv Market Analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Market analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /market/analysis:
    get:
      operationId: getMarketAnalysis
      tags: [market]
      summary: Get full market analysis for all symbols (500 candles)
      responses:
        "200":
          description: Market analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSummary"

  /market/chart/{symbol}:
    get:
      operationId: getChartData
      tags: [market]
      summary: Get 1000 candles + fractal markers (HH/HL/LH/LL) for chart display
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chart data with fractal markers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartData"

  /market/symbols:
    get:
      operationId: getSymbolList
      tags: [market]
      summary: Get list of available symbols
      responses:
        "200":
          description: Symbol list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolInfo"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Candle:
      type: object
      properties:
        time:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
      required:
        - time
        - open
        - high
        - low
        - close

    SymbolInfo:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        multiplier:
          type: number
      required:
        - symbol
        - name
        - multiplier

    FractalLevel:
      type: object
      properties:
        type:
          type: string
          enum: [SUPPORT, RESISTANCE]
        index:
          type: number
        price:
          type: number
      required:
        - type
        - index
        - price

    FractalMarker:
      type: object
      properties:
        index:
          type: number
        price:
          type: number
        type:
          type: string
          enum: [HH, HL, LH, LL]
      required:
        - index
        - price
        - type

    ChartData:
      type: object
      properties:
        symbol:
          type: string
        trend:
          type: string
          enum: [UPTREND, DOWNTREND]
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/FractalMarker"
        hh_level:
          type: ["number", "null"]
        hl_level:
          type: ["number", "null"]
        lh_level:
          type: ["number", "null"]
        ll_level:
          type: ["number", "null"]
        bar_count:
          type: number
        last_updated:
          type: string
      required:
        - symbol
        - trend
        - candles
        - markers
        - bar_count
        - last_updated

    TrendStructure:
      type: object
      properties:
        trend:
          type: string
          enum: [UPTREND, DOWNTREND]
        pattern:
          type: string
        last_resistance:
          type: number
        prev_resistance:
          type: number
        last_support:
          type: number
        prev_support:
          type: number
        bos_level:
          type: number
        choch_level:
          type: number
        pullback_level:
          type: number
        description:
          type: string
      required:
        - trend
        - description

    MACDData:
      type: object
      properties:
        macd:
          type: number
        signal:
          type: number
        histogram:
          type: number
        values:
          type: array
          items:
            type: number
        signal_values:
          type: array
          items:
            type: number
        histogram_values:
          type: array
          items:
            type: number
      required:
        - macd
        - signal
        - histogram

    TSIData:
      type: object
      properties:
        value:
          type: number
        is_oversold:
          type: boolean
        is_overbought:
          type: boolean
        values:
          type: array
          items:
            type: number
      required:
        - value
        - is_oversold
        - is_overbought

    SymbolAnalysis:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        volatility:
          type: number
        state:
          type: string
          enum: [PULLBACK, BOS_CONTINUATION, CHoCH_REVERSAL, IN_TREND]
        trend:
          type: string
          enum: [UPTREND, DOWNTREND]
        fractal_count:
          type: number
        support:
          type: ["number", "null"]
        resistance:
          type: ["number", "null"]
        bos_level:
          type: ["number", "null"]
        choch_level:
          type: ["number", "null"]
        description:
          type: string
        structure:
          $ref: "#/components/schemas/TrendStructure"
        tsi:
          $ref: "#/components/schemas/TSIData"
        macd:
          $ref: "#/components/schemas/MACDData"
        last_fractals:
          type: array
          items:
            $ref: "#/components/schemas/FractalLevel"
        last_updated:
          type: string
      required:
        - symbol
        - name
        - price
        - volatility
        - state
        - trend
        - fractal_count
        - description

    MarketSummary:
      type: object
      properties:
        timestamp:
          type: string
        pullback_count:
          type: number
        bos_count:
          type: number
        choch_count:
          type: number
        trending_count:
          type: number
        consolidation_count:
          type: number
        symbols:
          type: array
          items:
            $ref: "#/components/schemas/SymbolAnalysis"
      required:
        - timestamp
        - pullback_count
        - bos_count
        - choch_count
        - trending_count
        - consolidation_count
        - symbols
